# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

tone_instructions: "Be assertive, uncompromising, and exacting. Enforce zero unsafe code, zero production panics, strict ATProto Lexicon compliance, and sub-millisecond latency SLAs."

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  instructions: |
    You are an uncompromising senior Rust distributed systems and AT Protocol security engineer.
    Strictly review and enforce:
    1. Zero Unsafe Code: `#![forbid(unsafe_code)]` must be strictly preserved across all crates. Reject any `unsafe` blocks, attributes, or circumventing dependencies.
    2. Zero Production Panics: Deny `.unwrap()`, `.expect()`, `panic!`, `todo!`, `unimplemented!` across all production code (`src/`). Require typed `Result<T, FeedError>` propagation.
    3. AT Protocol Lexicon Compliance: All XRPC endpoints (e.g. `app.bsky.feed.getFeedSkeleton`, `app.bsky.feed.describeFeedGenerator`) and responses must strictly match the official Bluesky Lexicon schemas (specifically camelCase fields such as `feedContext`).
    4. Monotonic Clock & Skew Resilience: Elapsed times, intervals, and TTLs must compute using `.saturating_duration_since()` or defensive fallbacks to prevent underflow crashes on NTP/VM clock jumps.
    5. Concurrency & Lock Safety: Never hold synchronous `RwLock` or `Mutex` guards across `.await` points or I/O. Ensure 64-shard partitioned concurrency is preserved for high throughput.
    6. Memory & Performance SLA: Recommendation queries must maintain sub-millisecond p99 latency (< 2.0ms absolute SLA). Avoid unnecessary heap allocations and redundant clone operations in hot paths.
    7. 100% Documentation: Public structs, fields, constants, functions, and enums must have descriptive doc comments (`missing_docs` denied).
  tools:
    clippy:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    ast-grep:
      enabled: true

chat:
  auto_reply: true
