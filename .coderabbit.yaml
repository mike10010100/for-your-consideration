# CodeRabbit AI Code Review Configuration
# https://coderabbit.ai / https://docs.coderabbit.ai

language: "en-US"
tone_instructions: "Rigorous, concise, and focused on production-grade Rust systems architecture and security."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        Strictly enforce the project's non-negotiable invariants from AGENTS.md:
        1. Zero Unsafe Code: #![forbid(unsafe_code)] is enforced crate-wide. Flag any attempt to introduce unsafe.
        2. Zero Production Panics: Deny .unwrap(), .expect(), panic!, todo!, unimplemented!. All fallible functions must return Result<T, FeedError>.
        3. Lock Safety: NEVER allow holding parking_lot::RwLock or Mutex guards across .await points or async yields.
        4. Monotonic Time: All time-delta calculations must use saturating_duration_since or .map_or(0, ...) to prevent clock-warp crashes.
        5. Concurrency: High-throughput state must remain 64-shard partitioned.
    - path: "src/server.rs"
      instructions: |
        Verify SSRF & Auth Defenses:
        1. Ensure outbound PDS/PLC requests strictly validate URLs via validate_outbound_url_async (blocking RFC 1918, loopback, and metadata IPs).
        2. Ensure OAuth PKCE tokens, state single-use consumption, and DPoP ath bindings are cryptographically sound.
    - path: "tests/**/*.rs"
      instructions: |
        Ensure test suites are deterministic, stress concurrency without deadlocks, and do not introduce brittle sub-millisecond timing assumptions on virtualized 2-core CI runners.

chat:
  auto_reply: true
