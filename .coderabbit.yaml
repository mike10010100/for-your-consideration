# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

tone_instructions: "Be concise, rigorous, and direct. Enforce zero unsafe code, zero panics, and strict ATProto Lexicon compliance."

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  instructions: |
    Strictly verify and enforce:
    1. Zero Unsafe Code: `#![forbid(unsafe_code)]` across all crates and files.
    2. Zero Production Panics: Deny `.unwrap()`, `.expect()`, `panic!`, `todo!`, `unimplemented!` in `src/`. Strongly typed `FeedError` returns only.
    3. AT Protocol Lexicon Compliance: All XRPC endpoints (e.g. `app.bsky.feed.getFeedSkeleton`) and schemas must strictly follow official Bluesky Lexicon schemas (including camelCase property names such as `feedContext`).
    4. Monotonic Clock & Skew Resilience: Elapsed times and TTLs must use `.saturating_duration_since()` to guard against clock jumps.
    5. Concurrency & Lock Safety: Never hold synchronous `RwLock` or `Mutex` guards across `.await` points or network I/O.
    6. Performance & SLA: Maintain sub-millisecond p99 latency SLA.
    7. 100% Documentation: Public structs, fields, functions, and enums must have descriptive doc comments (`missing_docs` denied).
  tools:
    clippy:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true
