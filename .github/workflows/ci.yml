name: CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt-and-clippy:
    name: Code Formatting & Strict Clippy Safety Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Strict Compiler Lints & Invariants (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Full Test Suite & Durability Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Lexicon Schema Synchronization with Upstream Bluesky
        run: |
          ./scripts/sync_lexicons.sh
          git diff --exit-code lexicons/ || (echo "Upstream Bluesky Lexicon schema drift detected!" && exit 1)

      - name: Run all Unit, Integration, and Durability Tests
        run: cargo test --all-targets --verbose

  security-audit:
    name: Supply Chain & License Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny security checks
        uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Test Coverage & Regression Gate (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Test Coverage & Enforce 80% Threshold
        run: cargo llvm-cov --all-targets --fail-under-lines 80 --summary-only

  docker-build:
    name: Production Docker Build & Healthcheck Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: for-your-consideration:test
          load: true
