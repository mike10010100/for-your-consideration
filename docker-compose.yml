services:
  feed-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: for-your-consideration:${IMAGE_TAG:-latest}
    container_name: for-your-consideration
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "${PORT_BIND:-3030}:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - HOSTNAME=${HOSTNAME:-fyc.mike10010100.com}
      - SERVICE_DID=${SERVICE_DID:-did:web:fyc.mike10010100.com}
      - FEED_RKEY=${FEED_RKEY:-for-your-consideration}
      - ADMIN_HANDLE=${ADMIN_HANDLE:-mike10010100.com}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - REPLAY_HOURS=${REPLAY_HOURS:-12}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - SNAPSHOT_PATH=/data/snapshot.bin
      - SNAPSHOT_INTERVAL_SECS=300
      - RUST_LOG=info,for_your_consideration=info
    volumes:
      - fyc_data:/data:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-16384M}
        reservations:
          memory: 512M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fyc-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ~/.cloudflared:/etc/cloudflared:ro
    depends_on:
      feed-engine:
        condition: service_healthy

volumes:
  fyc_data:
    name: for_your_consideration_data
