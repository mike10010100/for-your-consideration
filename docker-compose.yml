services:
  feed-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: for-your-consideration:latest
    container_name: for-your-consideration
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - HOSTNAME=${HOSTNAME:-feed.example.com}
      - SERVICE_DID=${SERVICE_DID:-did:web:feed.example.com}
      - FEED_RKEY=${FEED_RKEY:-for-your-consideration}
      - ADMIN_HANDLE=${ADMIN_HANDLE:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - REPLAY_HOURS=${REPLAY_HOURS:-12}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - SNAPSHOT_PATH=/data/snapshot.bin
      - SNAPSHOT_INTERVAL_SECS=300
      - RUST_LOG=info,for_your_consideration=info
    volumes:
      - fyc_data:/data:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-8192M}
        reservations:
          memory: 512M

volumes:
  fyc_data:
    name: for_your_consideration_data
